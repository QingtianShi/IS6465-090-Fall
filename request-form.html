<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Peer Tutoring Hub | Request a Session</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; color: #202124; background: #f4f6f8; }
        main { max-width: 560px; margin: 40px auto; padding: 28px; background: white; border-radius: 10px; }
        h1 { margin-top: 0; }
        label { display: block; margin: 20px 0 8px; font-weight: bold; }
        input, select, button { box-sizing: border-box; width: 100%; padding: 12px; font: inherit; }
        input, select { border: 1px solid #767676; border-radius: 5px; }
        button { margin-top: 24px; background: #a6192e; color: white; border: 0; border-radius: 5px; cursor: pointer; }
        a { color: #174b85; }
        small { display: block; margin-top: 6px; }
        :focus-visible { outline: 3px solid #2165a8; outline-offset: 3px; }
        @media (max-width: 620px) { main { margin: 16px; padding: 20px; } }
    </style>
</head>
<body>
    <!-- Qingtian Shi | u1377576 | Lab 3 -->
    <main>
        <h1>Request a tutoring session</h1>
        <p>Choose your course and preferred session details. All fields are required.</p>
        <form action="process-request.php" method="post">
            <label for="course">Course</label>
            <select id="course" name="course" required>
                <option value="" disabled selected>Select a course</option>
                <option value="IS 6465">IS 6465</option>
                <option value="IS 6495">IS 6495</option>
                <option value="IS 6570">IS 6570</option>
            </select>

            <label for="topic">Topic</label>
            <input type="text" id="topic" name="topic" maxlength="120" aria-describedby="topic-help" required>
            <small id="topic-help">What do you need help with? Maximum 120 characters.</small>

            <label for="preferreddate">Preferred date</label>
            <input type="date" id="preferreddate" name="preferreddate" required>

            <label for="preferredtime">Preferred time</label>
            <select id="preferredtime" name="preferredtime" required>
                <option value="" disabled selected>Select a time</option>
                <option value="Morning">Morning</option>
                <option value="Afternoon">Afternoon</option>
                <option value="Evening">Evening</option>
            </select>
            <button type="submit">Request session</button>
        </form>
        <p><a href="lab3.php">View PHP array practice</a></p>
    </main>
</body>
</html>
